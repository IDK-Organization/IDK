<style>

:root[data-theme="dark"]{--paper:#1E1C18;--sheet:#292621;--ink:#EDE6D6;--soft:#A39A88;--line:#38332B;--accent:#EE6A55;--blot:#9AA0B0;--sh:0 1px 2px #0007,0 10px 26px #0005}

.seg button{position:relative;padding:3px 22px;font:700 24px var(--title);color:var(--soft);transition:color .2s}
.seg[data-m="ffa"] button:first-child,.seg[data-m="surv"] button:last-child{color:var(--sheet)}

.stick .knob{filter:none}

.pk{width:76px;height:76px;background:var(--sheet);border:1.8px solid var(--ink);border-radius:12px 9px 13px 8px;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.3,1.7,.5,1),border-color .2s;rotate:-1.5deg}.pk+.pk{rotate:1.5deg}
.pk canvas{width:100%;height:100%}.pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--sh);transform:translateY(-6px) scale(1.08)}
.foot{display:flex;align-items:flex-end;gap:14px}
.nav{position:relative;width:86px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 24px/1 var(--title);background:var(--sheet);border:1.8px solid var(--ink);border-radius:13px 9px 14px 10px;box-shadow:var(--sh);rotate:-2deg}
.nav::before,.good::before{content:"";position:absolute;top:-9px;left:50%;width:46px;height:16px;margin-left:-23px;background:var(--accent);opacity:.3;transform:rotate(-3deg);border-radius:2px}
.bd{position:absolute;top:-10px;right:-10px;width:26px;height:26px;display:grid;place-items:center;border-radius:50% 46% 52% 44%;background:var(--accent);color:var(--sheet);border:1.8px solid var(--ink);font:700 20px/1 var(--title);font-style:normal;animation:gp 1.6s infinite}.bd[hidden]{display:none}

@keyframes wob{50%{transform:rotate(-1.2deg) scale(1.03)}}
.nav:active,.play:active,.mode:active,.buy:active{translate:0 3px}
.on .lobby>*{animation:rise .55s cubic-bezier(.2,1.4,.4,1) both}.on .lobby>:nth-child(2){animation-delay:.07s}.on .lobby>:nth-child(3){animation-delay:.14s}

.good:nth-child(odd){rotate:-1deg}.good:nth-child(even){rotate:1deg}
.good canvas{width:104px;height:104px}.good.eq{border-color:var(--accent)}.good.pop{animation:gp .6s}.good.no{animation:no .35s}

.buy{display:flex;align-items:center;gap:5px;padding:0 14px 3px;font:700 26px/1.1 var(--title);color:var(--sheet);background:var(--ink);border-radius:10px 7px 9px 8px}
.buy.own{color:var(--ink);background:var(--sheet);border:1.8px solid var(--ink)}.eq .buy{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.buy.gift{grid-column:1/-1;justify-content:center;font-size:30px;padding:4px;color:var(--ink);background:#F2C23088;border:1.8px dashed var(--ink)}.gift.off{opacity:.55}

.row.me{background:var(--ink);color:var(--sheet)}.row.dead{opacity:.4}.row.dead span{text-decoration:line-through}
.row i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);flex:none}.row b{margin-left:auto;display:inline-block;font-size:18px}
.row b.up{animation:up .4s cubic-bezier(.3,1.8,.5,1)}@keyframes up{40%{transform:scale(1.7);color:var(--accent)}}
.rw{display:flex;justify-content:center;gap:20px;margin:0 0 14px;font:700 32px var(--title)}.rw:empty{display:none}.rw .gemi{vertical-align:-3px}
.on .sheet{animation:sh .5s cubic-bezier(.2,1.4,.4,1)}@keyframes sh{from{opacity:0;transform:translateY(40px) scale(.9) rotate(2deg)}}
@keyframes ban{0%{opacity:0;transform:scale(2.2) rotate(-9deg)}16%{opacity:1;transform:scale(.94) rotate(-2deg)}24%{transform:scale(1.05) rotate(-2deg)}30%,72%{opacity:1;transform:scale(1) rotate(-2deg)}100%{opacity:0;transform:translateY(-18px) scale(.9) rotate(-2deg)}}

</style>

<div id="app">

</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),c=cv.getContext('2d'),app=$('#app'),menu=$('#menu'),over=$('#over'),aimEl=$('#aim'),
F="'Patrick Hand','Bradley Hand','Segoe Print',cursive",PI=Math.PI,TAU=PI*2,WW=1600,WH=1200,

function buildLB(){const L=$('#lbd');L.innerHTML='';L.hidden=G.mode!=='ffa';(G.all||[]).forEach(f=>{const d=document.createElement('div');d.className='row'+(f===G.p?' me':'');d.innerHTML='<i></i><span>'+f.name+'</span><b>0</b>';f.row=d;L.appendChild(d)});lbUpdate()}
function lbUpdate(){if(G.mode!=='ffa'||!G.all)return;[...G.all].sort((a,b)=>b.k-a.k||(b.hp>0)-(a.hp>0)).forEach((f,i)=>{const d=f.row,b=d.lastChild;d.style.transform=`translateY(${i*29}px)`;d.classList.toggle('dead',f.hp<=0);d.firstChild.style.background=(f===G.p?sk(f.cls):f.col)||(f.cls==='rammer'?'#8E5BD0':'#F2C230');if(b.textContent!=f.k){b.textContent=f.k;retrig(b,'up')}})}

function pause(){if(G.s!=='play')return;G.s='pause';mv.reset();aim.reset();showOver('Paused','Take a breath, doodler.','Resume')}
function resume(){G.s='play';over.classList.remove('on')}
function spawn(){const p=G.p,a=Math.random()*TAU,d=480+Math.random()*120,big=G.wave>2&&Math.random()<Math.min(.35,(G.wave-2)*.08),
 e={id:Math.random()*999|0,x:clamp(p.x+Math.cos(a)*d,40,WW-40),y:clamp(p.y+Math.sin(a)*d,40,WH-40),kx:0,ky:0,r:big?30:20,hp:big?5500:2200,sp:(big?58:84)+G.wave*3,dmg:big?1300:700,pts:big?30:10,cool:.9,stun:0,fl:0,born:0,t:Math.random()*9};
 e.max=e.hp;G.en.push(e);ring(e.x,e.y)}
function hit(e,d,kx,ky,by){const g=G;e.hp-=d;e.fl=.12;e.kx+=kx;e.ky+=ky;const me=e===g.p||by===g.p;g.stop=me?.05:.012;g.zm=Math.max(g.zm,me?(e.hp<=0?1.08:1.035):1);shake=Math.max(shake,(e.cls?8:5)*(me?1:.35));
 tx(e.x,e.y-(e.cls?60:e.r+8),'-'+d,e===g.p?T.ink:T.acc);burst(e.x,e.y,e.hp<=0?16:7);ring(e.x,e.y);if(e===g.p)flash();
 if(e.hp<=0){e.hp=0;if(!e.cls)g.score+=e.pts;if(by&&by.cls&&by!==e)by.k++;if(by===g.p&&e!==g.p)g.ko++;if(me){g.slow=.16;shake=Math.max(shake,9)}info()}}
function launch(f,a,pw){const C=CL[f.cls];f.a=a;f.cd=C.cd;f.pop=1;f.na=[];
 if(f.cls==='rammer'){const d=C.min+(C.max-C.min)*pw;f.atk={k:'dash',a,t:0,d:.12+d/1700,hit:new Set(),x0:f.x,y0:f.y,x1:clamp(f.x+Math.cos(a)*d,26,WW-26),y1:clamp(f.y+Math.sin(a)*d,44,WH-26)}}
 else f.atk={k:'net',a,t:0,d:.3,hit:new Set(),ang:a-PI/2}}
function fire(v){const g=G,p=g.p;if(g.s!=='play'||p.atk||p.cd>0||p.stun>0)return;const C=CL[p.cls],l=Math.hypot(v.x,v.y);let a,pw=1;
 if(l>.18){a=Math.atan2(v.y,v.x);pw=clamp((l-.18)/.7,0,1)}
 else{let n=null,nd=1e9;for(const e of tg(p)){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;n=e}}
  a=n?Math.atan2(n.y-p.y,n.x-p.x):p.a;if(n&&p.cls==='rammer')pw=clamp((nd+30-C.min)/(C.max-C.min),0,1)}
 launch(p,a,pw)}

/* one fighter, one frame: attacks, knockback, movement */
function stepF(f,dt,mx,my){const C=CL[f.cls],a=f.atk;f.cd-=dt;f.inv-=dt;f.fl-=dt;f.t+=dt;f.stun-=dt;f.pop=Math.max(0,f.pop-dt*4);f.lag=lerp(f.lag,f.hp,Math.min(1,dt*2.5));if(a&&a.k==='dash'){f.tr.push(f.x,f.y);if(f.tr.length>20)f.tr.splice(0,2)}else if(f.tr.length)f.tr.splice(0,2);if(f.mv>.6&&!a&&(f.dg=(f.dg||0)-dt)<=0){f.dg=.11;puff(f.x,f.y+18)}
 if(a){a.t+=dt;const u=Math.min(1,a.t/a.d),ts=tg(f);
  if(a.k==='dash'){const e=u*u*(3-2*u);f.x=lerp(a.x0,a.x1,e);f.y=lerp(a.y0,a.y1,e);f.inv=.15;
   if(Math.random()<.6)puff(f.x,f.y+16);
   for(const n of ts)if(!a.hit.has(n)&&!(n.inv>0)&&Math.hypot(n.x-f.x,n.y-f.y)<n.r+28){a.hit.add(n);hit(n,1100,Math.cos(a.a)*560,Math.sin(a.a)*560,f)}
   if(u>=1){ring(f.x,f.y+14);for(let i=0;i<5;i++)puff(f.x+(Math.random()-.5)*34,f.y+16);shake=Math.max(shake,4)}}
  else{a.ang=a.a-PI/2+PI*u;f.na.push(a.ang);if(f.na.length>10)f.na.shift();
   for(const n of ts){const dx=n.x-f.x,dy=n.y-f.y;if(!a.hit.has(n)&&!(n.inv>0)&&Math.hypot(dx,dy)<C.reach+n.r&&Math.abs(adiff(Math.atan2(dy,dx),a.ang))<.7){a.hit.add(n);hit(n,800,Math.cos(a.ang)*220,Math.sin(a.ang)*220,f);n.stun=.9}}}
  if(u>=1)f.atk=null}
 if(!a||a.k==='net'){const s=C.spd*(a?.5:1)*(f.stun>0?0:1),k=Math.min(1,dt*14);f.vx=lerp(f.vx,mx*s,k);f.vy=lerp(f.vy,my*s,k);f.x+=f.vx*dt;f.y+=f.vy*dt}
 f.x+=f.kx*dt;f.y+=f.ky*dt;f.kx*=Math.pow(.003,dt);f.ky*=Math.pow(.003,dt);
 f.x=clamp(f.x,26,WW-26);f.y=clamp(f.y,44,WH-26);
 const sp=Math.hypot(f.vx,f.vy);f.mv=lerp(f.mv,sp>30?1:0,Math.min(1,dt*10));if(sp>30&&!f.atk)f.a=Math.atan2(f.vy,f.vx)}

/* bot brain: Rammers kite and charge, Catchers rush in and sweep */
function ai(b,dt){const A=b.ai,C=CL[b.cls];let n=null,nd=1e9;for(const o of G.f)if(o!==b&&o.hp>0){const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<nd){nd=d;n=o}}
 if(!n)return[0,0];if((A.st-=dt)<=0){A.st=1.5+Math.random()*2;A.s=Math.random()<.5?-1:1}
 const dx=n.x-b.x,dy=n.y-b.y,ux=dx/nd,uy=dy/nd;let mx=ux,my=uy;
 if(b.hp<b.max*.3&&nd<300){mx=-ux;my=-uy}
 else if(b.cls==='rammer'){if(nd<150){mx=-ux*.5;my=-uy*.5}else if(nd<260){mx=0;my=0}mx-=uy*.6*A.s;my+=ux*.6*A.s}
 if(!b.atk&&b.cd<=0&&b.stun<=0){const inR=b.cls==='rammer'?nd>80&&nd<C.max-10:nd<C.reach+n.r+12;
  if(inR){if((A.r-=dt)<=0){A.r=.3+Math.random()*.45;launch(b,Math.atan2(dy+n.vy*.2,dx+n.vx*.2),b.cls==='rammer'?clamp((nd+25-C.min)/(C.max-C.min),0,1):1)}}else A.r=.35}
 const l=Math.hypot(mx,my);return l>1?[mx/l,my/l]:[mx,my]}

function update(dt){const g=G,p=g.p;g.t+=dt;
 let mx=mv.v.x,my=mv.v.y;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))mx--;if(keys.has('KeyD')||keys.has('ArrowRight'))mx++;
 if(keys.has('KeyW')||keys.has('ArrowUp'))my--;if(keys.has('KeyS')||keys.has('ArrowDown'))my++;
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 stepF(p,dt,mx,my);
 if(g.mode==='ffa'){
  for(const b of g.f)if(b!==p&&b.hp>0){const[bx,by]=ai(b,dt);stepF(b,dt,bx,by)}
  for(const a of g.f)for(const b of g.f)if(a!==b&&a.hp>0&&b.hp>0&&!(a.atk&&a.atk.k==='dash')){const ox=a.x-b.x,oy=a.y-b.y,od=Math.hypot(ox,oy)||1;if(od<46){a.x+=ox/od*(46-od)*.12;a.y+=oy/od*(46-od)*.12}}
 }else{
  if(!g.en.length&&!g.q&&(g.gap-=dt)<=0){g.wave++;g.q=4+g.wave*3;g.gap=1.8;if(g.wave>1)p.hp=Math.min(p.max,p.hp+p.max*.15);banner('Wave '+g.wave);info()}
  if(g.q&&(g.sp-=dt)<=0){g.sp=clamp(.95-g.wave*.06,.35,.95);g.q--;spawn()}
  for(const e of g.en){e.t+=dt;e.fl-=dt;e.cool-=dt;e.born=Math.min(1,e.born+dt*2.2);
   const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
   if(e.stun>0)e.stun-=dt;else if(e.born>=1){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt}
   e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.003,dt);e.ky*=Math.pow(.003,dt);
   for(const o of g.en)if(o!==e){const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy)||1,m=e.r+o.r;if(od<m){e.x+=ox/od*(m-od)*.1;e.y+=oy/od*(m-od)*.1}}
   e.x=clamp(e.x,e.r,WW-e.r);e.y=clamp(e.y,e.r,WH-e.r);
   if(e.born>=1&&e.stun<=0&&d<e.r+22&&e.cool<=0&&p.inv<=0){e.cool=.9;hit(p,e.dmg,-dx/d*300,-dy/d*300,e)}}
  g.en=g.en.filter(e=>e.hp>0)}
 g.f=g.f.filter(o=>o.hp>0||o===p);
 if(p.hp<=0)return fin(false);
 if(g.mode==='ffa'&&g.f.length===1)return fin(true);
 for(const f of g.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}
 g.fx=g.fx.filter(f=>f.t<f.l);for(const t of g.tx)t.t+=dt;g.tx=g.tx.filter(t=>t.t<.9);for(const h of g.gh)h.t+=dt;g.gh=g.gh.filter(h=>h.t<.25);
 g.zm=lerp(g.zm,1,Math.min(1,dt*5));const k=1-Math.pow(.003,dt);g.cx=lerp(g.cx,p.x+p.vx*.18,k);g.cy=lerp(g.cy,p.y+p.vy*.18,k);
 const rv=Math.round(clamp(1-p.cd/CL[p.cls].cd,0,1)*10)/10;if(rv!==g.rv){g.rv=rv;aimEl.style.setProperty('--r',rv)}}

function hb(x,y,w,h,f,col,lag){c.fillStyle=T.sheet;c.strokeStyle=T.ink;c.lineWidth=2;c.beginPath();rr(x-w/2,y,w,h,h/2);c.fill();c.stroke();
 if(lag>f){c.globalAlpha=.4;c.fillStyle=T.acc;c.beginPath();rr(x-w/2+2,y+2,Math.max(h-4,(w-4)*lag),h-4,(h-4)/2);c.fill();c.globalAlpha=1}
 if(f>0){c.fillStyle=col;c.beginPath();rr(x-w/2+2,y+2,Math.max(h-4,(w-4)*f),h-4,(h-4)/2);c.fill()}}

function net(f){const q=f.atk,L=CL.catcher.reach,col=f===G.p?tc():T.acc,n=f.na.length,a0=n?f.na[0]:q.ang,w=(q.ang-a0)/TAU;c.save();c.translate(f.x,f.y);
 if(w>.004){let fs=col+'55';if(c.createConicGradient){const g=c.createConicGradient(a0,0,0);g.addColorStop(0,col+'00');g.addColorStop(Math.min(.999,w),col+'99');g.addColorStop(Math.min(1,w+.002),col+'00');fs=g}
  c.fillStyle=fs;c.beginPath();c.moveTo(0,0);c.arc(0,0,L*1.05,a0,q.ang);c.closePath();c.fill();
  c.lineCap='round';c.strokeStyle=col;c.globalAlpha=.5;c.lineWidth=8;c.beginPath();c.arc(0,0,L*.92,a0,q.ang);c.stroke()}
 for(let i=0;i<n;i++){const k=(i+1)/n;c.save();c.rotate(f.na[i]);c.translate(L*.88,0);c.globalAlpha=.06+.28*k*k;c.fillStyle=col;c.beginPath();c.ellipse(0,0,10,22,0,0,TAU);c.fill();c.restore()}
 c.globalAlpha=1;c.rotate(q.ang);c.strokeStyle=T.ink;c.lineWidth=3;c.beginPath();c.moveTo(16,0);c.lineTo(L*.7,0);c.stroke();
 c.translate(L*.88,0);const h=()=>{c.beginPath();c.ellipse(0,0,10,22,0,0,TAU)};h();c.globalAlpha=.8;c.fillStyle=T.sheet;c.fill();c.globalAlpha=1;
 c.save();c.clip();c.lineWidth=1.2;c.beginPath();for(let i=-20;i<=20;i+=7){c.moveTo(i,-22);c.lineTo(i,22);c.moveTo(-10,i);c.lineTo(10,i)}c.stroke();c.restore();h();c.lineWidth=2.8;c.stroke();c.restore()}

function drawF(f){const g=G,q=f.atk,ds=q&&q.k==='dash',nt=q&&q.k==='net',pl=f===g.p,col=pl?tc():T.acc,sc=pl?sk(f.cls):f.col,n=f.tr.length/2;
 c.fillStyle=T.ink;c.globalAlpha=.12;c.beginPath();c.ellipse(f.x,f.y+20,24*(1-Math.abs(Math.sin(f.t*11))*.14*f.mv),7,0,0,TAU);c.fill();c.globalAlpha=1;
 if(n>1){const L=Math.hypot(f.x-f.tr[0],f.y-f.tr[1]);
  if(L>10){c.save();c.translate(f.x,f.y);c.rotate(q?q.a:f.a);const gr=c.createLinearGradient(-L,0,0,0);gr.addColorStop(0,col+'00');gr.addColorStop(1,col+'b0');c.fillStyle=gr;c.beginPath();c.moveTo(6,-24);c.lineTo(-L,-8);c.lineTo(-L,8);c.lineTo(6,24);c.closePath();c.fill();
   c.lineCap='round';c.strokeStyle=T.ink;c.lineWidth=2.4;for(const y of[-18,-7,7,18]){c.globalAlpha=.3;c.beginPath();c.moveTo(-8,y);c.lineTo(-L*(.55+Math.abs(y)/36),y);c.stroke()}c.restore();c.globalAlpha=1}
  for(let i=1;i<n-1;i+=2){const k=i/n;c.globalAlpha=.06+.3*k*k;figure(c,f.cls,f.tr[i*2],f.tr[i*2+1]-4,1,{col:sc})}c.globalAlpha=1}
 const kick=Math.sin(f.pop*PI)*.14,lean=nt?(Math.cos(q.a)>=0?1:-1)*Math.sin(q.t/q.d*PI)*.25:0,st=ds?Math.sin(Math.min(1,q.t/q.d)*PI):0;
 c.save();c.translate(f.x,f.y);if(ds){c.rotate(q.a);c.scale(1+.4*st,1-.25*st);c.rotate(-q.a)}c.translate(-f.x,-f.y);
 figure(c,f.cls,f.x,f.y-4-Math.abs(Math.sin(f.t*11))*5*f.mv,1,{col:sc,fl:f.fl>0,hold:nt,sq:Math.sin(f.t*13)*.05*f.mv+Math.sin(f.t*3+f.id)*.015-kick,rot:f.vx*.0005+lean});c.restore();
 if(f.stun>0){c.strokeStyle='#F2C230';c.lineWidth=2.4;c.beginPath();for(let i=-2;i<=2;i++){c.moveTo(f.x+i*10,f.y-30);c.lineTo(f.x+i*10,f.y+24);c.moveTo(f.x-26,f.y+i*11-4);c.lineTo(f.x+26,f.y+i*11-4)}c.stroke()}
 const r=f.hp/f.max;hb(f.x,f.y-68,72,12,r,r>.3?'#5A9E6F':T.acc,f.lag/f.max);
 c.font=`700 ${pl?17:15}px ${F}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=5;c.strokeStyle=T.sheet;c.fillStyle=T.ink;
 const s=pl?String(Math.ceil(f.hp)):f.name+(f.k?' ✕'+f.k:'');c.strokeText(s,f.x,f.y-80);c.fillText(s,f.x,f.y-80)}

function render(){const g=G,p=g.p,C=CL[p.cls];c.fillStyle=T.paper;c.fillRect(0,0,vw,vh);
 const cx=vw>=WW?(WW-vw)/2:clamp(g.cx-vw/2,-40,WW-vw+40),cy=vh>=WH?(WH-vh)/2:clamp(g.cy-vh/2,-40,WH-vh+40);
 c.save();c.translate(Math.round(-cx+Math.sin(last*.07)*shake),Math.round(-cy+Math.cos(last*.059)*shake));
 c.drawImage(PAPER,-60,-60);
 if(g.s==='play'&&aim.on){const v=aim.v,l=Math.hypot(v.x,v.y);if(l>.18){c.save();c.translate(p.x,p.y);c.rotate(Math.atan2(v.y,v.x));
  c.setLineDash([9,7]);c.lineDashOffset=-g.t*28;c.lineWidth=2.4;c.strokeStyle=T.acc;c.lineCap='round';
  if(p.cls==='rammer'){const d=C.min+(C.max-C.min)*clamp((l-.18)/.7,0,1);c.globalAlpha=.15;c.fillStyle=T.acc;c.fillRect(0,-24,d,48);c.globalAlpha=1;c.strokeRect(0,-24,d,48);
   c.setLineDash([]);c.lineWidth=3.2;c.beginPath();c.moveTo(d-14,-15);c.lineTo(d,0);c.lineTo(d-14,15);c.stroke()}
  else{c.beginPath();c.moveTo(0,0);c.arc(0,0,C.reach,-PI/2,PI/2);c.closePath();c.globalAlpha=.3;c.fillStyle='#F2C230';c.fill();c.globalAlpha=1;c.stroke()}
  c.restore()}}
 for(const h of g.gh){c.globalAlpha=.3*(1-h.t/.25);figure(c,h.c,h.x,h.y-4,1,{})}c.globalAlpha=1;
 for(const o of[...g.en,...g.f.filter(o=>o.hp>0)].sort((a,b)=>a.y-b.y)){
  if(o.cls)drawF(o);else{c.fillStyle=T.ink;c.globalAlpha=.12;c.beginPath();c.ellipse(o.x,o.y+o.r*.8,o.r,o.r*.28,0,0,TAU);c.fill();c.globalAlpha=1;blot(o,p);if(o.hp<o.max)hb(o.x,o.y-o.r-14,o.r*2,8,o.hp/o.max,T.acc,0)}}
 for(const f of g.f)if(f.hp>0&&f.atk&&f.atk.k==='net')net(f);
 for(const f of g.fx){const k=1-f.t/f.l;c.globalAlpha=k;
  if(f.k==='ring'){c.strokeStyle=T.ink;c.lineWidth=.5+2.5*k;c.beginPath();c.arc(f.x,f.y,f.r+(1-k)*46,0,TAU);c.stroke()}
  else if(f.p){c.strokeStyle=T.ink;c.lineWidth=1.5;c.beginPath();c.arc(f.x,f.y,f.r*(2-k),0,TAU);c.stroke()}
  else{c.strokeStyle=f.c;c.lineCap='round';c.lineWidth=f.r*k+1;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-f.vx*.05,f.y-f.vy*.05);c.stroke()}}
 c.globalAlpha=1;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=5;c.strokeStyle=T.sheet;
 for(const t of g.tx){c.font=`700 ${24+Math.max(0,.25-t.t)*70|0}px ${F}`;c.globalAlpha=1-t.t/.9;const y=t.y-t.t*50;c.strokeText(t.s,t.x,y);c.fillStyle=t.col;c.fillText(t.s,t.x,y)}
 c.globalAlpha=1;c.restore()}

/* wiring */
document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{cls=b.dataset.c;document.querySelectorAll('.pk').forEach(x=>x.classList.toggle('sel',x===b));bp=1;refresh()});

$('#tshop').onclick=$('#g1').onclick=openShop;$('#back').onclick=()=>{shop.classList.remove('on');menu.classList.add('on');refresh()};

function size(){const d=Math.min(devicePixelRatio||1,2);vw=app.clientWidth;vh=app.clientHeight;cv.width=vw*d;cv.height=vh*d;c.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();theme();refresh();
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);new MutationObserver(theme).observe(document.documentElement,{attributes:true});
document.addEventListener('visibilitychange',()=>document.hidden&&pause());
requestAnimationFrame(function f(ts){try{const dt=Math.min(.033,(ts-last)/1e3||0);last=ts;
 if(G.s==='play'){if(G.stop>0)G.stop-=dt;else{G.slow-=dt;update(dt*(G.slow>0?.4:1))}}
 shake=Math.max(0,shake-dt*40);if(G.p&&G.s!=='menu')render();if(menu.classList.contains('on')||shop.classList.contains('on'))drawCards(ts/1e3)}catch(e){console.error(e)}requestAnimationFrame(f)});
